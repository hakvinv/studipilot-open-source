name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: uni-rag/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -r remote-rag/requirements.txt
      - run: python scripts/check_repository.py
      - run: python scripts/check.py
